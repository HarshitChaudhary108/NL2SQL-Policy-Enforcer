role: analyst
version: "1.0"

# Which tools this role can access at all
allowed_tools:
  - sql

# Tool-specific rules
tools:
  sql:
    allowed_operations:
      - SELECT          # can read
    blocked_patterns:   # SQL patterns that are always blocked
      - "DROP"  
      - "DELETE"
      - "UPDATE"
      - "INSERT"
      - "TRUNCATE"
      - "ALTER"
    max_rows: 500       # Data exfiltration limit
    allowed_tables:
      - ratings
      - payments
    blocked_tables:
      - rides
      - users
      - vehicles