services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nl2sql-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: nl2sql-streamlit
    environment:
      # container-to-container DNS name from the "api" service above —
      # NOT localhost, since these are two separate containers
      - BACKEND_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped